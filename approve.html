<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchasing Approval</title><style>body{font:15px Arial;background:#f1f6fa;color:#193d52;margin:0}main{max-width:850px;margin:35px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 5px 30px #1233}h1{color:#125d84}button{padding:11px 18px;border:0;border-radius:5px;cursor:pointer;margin:5px;background:#1365a1;color:white}button:disabled{opacity:.5}button.reject{background:#ae3333}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}textarea{width:100%;min-height:80px}#notice{padding:12px;background:#edf5fb;margin:15px 0;white-space:pre-wrap}.hide{display:none}</style></head><body><main><h1>Purchase Request Approval</h1><div id="notice">Loading...</div><div id="content" class="hide"><h2 id="id"></h2><p id="meta"></p><table><thead><tr><th>Item</th><th>Necessary for</th><th>Qty</th><th>Unit price</th></tr></thead><tbody id="items"></tbody></table><h3 id="total"></h3><h3>Selected supplier and justification</h3><p id="reason"></p><h3>Offers</h3><div id="files"></div><h3>Decision</h3><p id="state"></p><div id="controls"><label>Decision note (optional)<textarea id="note" maxlength="2000"></textarea></label><p>Review the information and confirm your decision below.</p><button id="approve">Confirm Approve</button><button id="reject" class="reject">Confirm Reject</button></div></div></main><script>
const fn='https://ewxydldbroiujkghltci.supabase.co/functions/v1/purchasing-admin',key='sb_publishable_l8xZmArEzhrKP7IBY8XuoQ_PQFM7iIJ',token=new URLSearchParams(location.search).get('token')||'';const $=id=>document.getElementById(id);async function api(action,other={}){const r=await fetch(fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:key},body:JSON.stringify({action,token,...other})});const d=await r.json();if(!r.ok)throw Error(d.error||'Server error');return d}function cell(row,value){const td=document.createElement('td');td.textContent=String(value??'');row.append(td)}async function load(){try{const d=await api('review'),r=d.request;$('content').classList.remove('hide');$('notice').textContent='This approval link expires on '+new Date(d.expiresAt).toLocaleString()+'. Keep it confidential.';$('id').textContent=r.id;$('meta').textContent='Requester: '+r.requesterName+' | Created: '+new Date(r.created).toLocaleString();for(const x of r.items){const tr=document.createElement('tr');[x.name,x.purpose,x.quantity,x.unitPrice].forEach(v=>cell(tr,v));$('items').append(tr)}$('total').textContent='Total excluding VAT: '+Number(r.totalPrice).toFixed(2)+' '+r.currency;$('reason').textContent=r.supplierReason;for(const f of r.attachments){const b=document.createElement('button');b.textContent='Open offer: '+f.name;b.onclick=async()=>{try{const d=await api('reviewFile',{index:f.index});window.open(d.url,'_blank','noopener,noreferrer')}catch(e){alert(e.message)}};$('files').append(b)}if(!r.attachments.length)$('files').textContent='No offers attached';$('state').textContent=d.status;if(d.status!=='Pending Approval')$('controls').classList.add('hide')}catch(e){$('notice').textContent=e.message}}async function decide(value){if(!confirm('Confirm '+value+'? This decision cannot be undone.'))return;$('approve').disabled=$('reject').disabled=true;try{const d=await api('decide',{decision:value,note:$('note').value});$('state').textContent=d.status;$('controls').classList.add('hide');$('notice').textContent='Decision recorded successfully.'}catch(e){alert(e.message);$('approve').disabled=$('reject').disabled=false}}$('approve').onclick=()=>decide('Approved');$('reject').onclick=()=>decide('Rejected');load();
</script></body></html>
